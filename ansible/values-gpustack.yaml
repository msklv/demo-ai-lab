# values релиза GPUStack 2.2.3 (спека architecture/specs/gpustack-spec.md §4.3).
# Ставится helm'ом с консоли: OCI-чарт, а AppProject `infra` разрешает только свой git-репозиторий.
# Манифесты под Argo (Ingress, Certificate) — gitops/infra-apps/gpustack/, RuntimeClass — в infra/.
global:
  nodeSelector: {}
image:
  tag: v2.2.3                 # пин чарта 2.2.3; образы предтянуты на k8s-04 (G2)
higress-core:
  enabled: false              # у стенда свой Higress 2.1.9 (ADR-0001)
gateway:
  ingressClassname: higress   # in-cluster gateway mode на существующем шлюзе
server:
  ingress:
    # Чарт рендерит Ingress ВСЕГДА (templates/server-service.yaml), host подставляется только
    # отсюда; при hostname: null получается catch-all-маршрут шлюза на любой Host. Поэтому host
    # задаём (он публичный), а TLS-секрет — своим Ingress + Certificate (PEM в values запрещён).
    hostname: api.demo-ai-lab.ru
  dataVolume:
    size: 20Gi                # longhorn default r=2 → 40Gi физически
  environmentConfig:
    # G7: SSO через Keycloak (realm dev, клиент gps — confidential, redirect
    # https://api.demo-ai-lab.ru/auth/oidc/callback). Секрет клиента в git не идёт:
    # он лежит в Secret gpustack-oidc, который подмешивает в envFrom сервера
    # ansible/gpustack-upgrade.sh (чарт умеет только литералы в ConfigMap).
    # Установка/апгрейд — только через этот скрипт, иначе SSO молча отвалится.
    GPUSTACK_OIDC_ISSUER: https://auth.demo-ai-lab.ru/realms/dev
    GPUSTACK_OIDC_CLIENT_ID: gps
    GPUSTACK_OIDC_REDIRECT_URI: https://api.demo-ai-lab.ru/auth/oidc/callback
    # Чарт по умолчанию подставляет сюда http://<ingress-host> (схему берёт из TLS только если
    # серт задан в values, а он у нас в своём Ingress). От этого URL считается
    # post_logout_redirect_uri при выходе → Keycloak отвечал «Invalid redirect uri».
    GPUSTACK_SERVER_EXTERNAL_URL: https://api.demo-ai-lab.ru
    # новые SSO-пользователи создаются неактивными: доступ выдаётся админом осознанно
    GPUSTACK_EXTERNAL_AUTH_DEFAULT_INACTIVE: "true"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: demo-ai-lab/role     # метка есть на k8s-02 и k8s-03
                operator: In
                values: ["ingress"]
worker:
  enabled: true
  gpuVendors: [nvidia]
  dataDir: /var/lib/gpustack
  environmentConfig:
    # Оператор GPUStack ставит свои «applications» (device-manager + kueue). В этом режиме рантайм
    # ищет на ноде метку feature.gpustack.ai/<manu>-<group>.profile-queue, а оператор пишет
    # .z-queue → деплой модели падал: «Failed to find Kueue queue name on node k8s-04 for runtime
    # environment NVIDIA_VISIBLE_DEVICES». Для стенда Kueue-адмиссия не нужна: поды моделей
    # создаются напрямую (деплой в обход очереди), поведение очередей на демо не показываем.
    GPUSTACK_RUNTIME_KUBERNETES_KDP_NO_KUEUE_ADMISSION: "1"
operator:
  resources:                  # дефолт чарта 4 CPU / 8Gi — для 28-GiB ноды избыточен
    requests: {cpu: 200m, memory: 256Mi}
    limits:   {cpu: "2",  memory: 2Gi}
