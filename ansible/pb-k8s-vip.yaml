---
# kube-vip: статический под VIP 192.168.10.240 (controlPlaneEndpoint) на мастерах.
# ADR-0003 вариант A; архитектура — architecture/specs/k8s-install-spec.md §4, §7 (F1).
#
# КОГДА ГНАТЬ и порядок дня F1 (проверено 2026-10-18):
#   1) pb-k8s-pkgs.yaml (kubelet без config.yaml не поднимает статические поды);
#   2) pb-k8s-vip.yaml (этот) — каталог, образ, манифест; под физически стартует
#      только после init, когда kubelet получит конфигурацию;
#   3) bootstrap VIP вручную на будущем первом мастере: `ip addr add .240/32 dev eno1`
#      (init ждёт API на endpoint — пока VIP не отвечает никто, init его не дождётся);
#   4) kubeadm init → kubelet стартует, kube-vip подхватывает admin.conf (hostPath),
#      избирает лидера и перенимает VIP; ручной костыль снять `ip addr del` после
#      появления "New leader" в логах (лидером может быть любой мастер).
# В site-cluster.yml НЕ входит.
#
# Грабли v0.9.x, зашитые в шаблон (иначе CrashLoop/дедлок, инцидент 2026-10-18):
#   - command абсолютным /kube-vip (бинаря в PATH нет);
#   - hostPath /etc/kubernetes/admin.conf: manager ищет kubeconfig там (SA-токена у
#     статического пода нет, incluster-ветка падает);
#   - cp_detect=true: иначе CP-режим резолвит hostname "kubernetes" (не резолвится)
#     или ходит в VIP (дедлок: VIP даёт только избранный лидер).
#
# Приёмка (только после init; CRI-имена контейнеров в ctr — hex-id, грепать бессмысленно):
#   kubectl -n kube-system logs -l app.kubernetes.io/name=kube-vip | grep "New leader"
#   ровно один мастер держит VIP: ip -4 addr show eno1 | grep 192.168.10.240
#
# Запуск (инвентарь cluster, группа masters = 01/02/03):
#   export SUDO_PASSWORD_demo_ai_lab=...   # экспортируется из локального приватного хранилища
#   export K8S01_USER=... K8S02_USER=... K8S03_USER=...
#   ansible-playbook -i hosts.cluster.yml pb-k8s-vip.yaml

- name: kube-vip static pod on masters (demo-ai-lab, F1 pre-init)
  hosts: masters
  become: true
  vars:
    vip_address: "192.168.10.240"   # API-VIP, выведен из DHCP-пула роутера (2026-10-17)
    vip_interface: eno1             # LAN-NIC, у всех четырёх проверен 2026-10-18
    # Пин: тег + digest (сверен через ghcr API 2026-10-18). Bump = править строку + прогон.
    kube_vip_image: "ghcr.io/kube-vip/kube-vip:v0.9.2@sha256:c6d4f3a3fc2b7e95a23a20a0b05b7c64b2e5620783c8fa69a9bac753f99cc8bc"
    manifests_dir: /etc/kubernetes/manifests

  pre_tasks:
    - name: Assert Ubuntu and LAN interface present
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - vip_interface in ansible_interfaces
        fail_msg: "Нужен Ubuntu с интерфейсом {{ vip_interface }} (проверить имя NIC)."

  tasks:
    - name: Ensure manifests dir exists (kubelet создаёт его только при init)
      ansible.builtin.file:
        path: "{{ manifests_dir }}"
        state: directory
        mode: "0700"

    # Предтягиваем образ в k8s.io-неймспейс containerd: статический под поднимется без
    # ожидания реестра (imagePullPolicy: IfNotPresent). Важно: ctr 2.x не ЗАПУСКАET
    # digest-индексы (молча STOPPED), но pull и CRI резолвят индекс корректно.
    - name: Pre-pull kube-vip image into containerd (k8s.io)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ctr -n k8s.io images ls -q | grep -qxF '{{ kube_vip_image }}'
          || ctr -n k8s.io images pull '{{ kube_vip_image }}'
        executable: /bin/bash
      register: cdi_pull
      changed_when: "'unpacking' in cdi_pull.stdout or 'pulled image' in cdi_pull.stdout"

    - name: Render kube-vip static pod manifest
      ansible.builtin.template:
        src: templates/kube-vip.yaml.j2
        dest: "{{ manifests_dir }}/kube-vip.yaml"
        owner: root
        group: root
        mode: "0600"
      # kubelet watch-ит каталог — рестарт сервиса не нужен.