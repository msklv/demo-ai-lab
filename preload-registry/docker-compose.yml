# Локальный реестр предзагрузки demo-ai-lab — registry:2 в docker compose.
# Детерминированный запуск: образ запинен по digest, фиксированные имя контейнера, порт и том.
#
#   docker compose -f preload-registry/docker-compose.yml up -d
#   docker compose -f preload-registry/docker-compose.yml ps          # ждём (healthy)
#   docker compose -f preload-registry/docker-compose.yml down        # остановить, данные остаются
#   docker volume rm preload_registry                                 # стереть склад
#
# Адрес консоли — статический DHCP-лиз 192.168.10.188 (MikroTik). Адрес внутри пула — это
# нормально: статический лиз приоритетнее пула, из пула выводят только VIP (.230/.240).
# Порт 5050, а не 5000: на macOS 5000/7000 занимает AirPlay Receiver.
# Том `preload_registry` именованный, создаётся compose'ом сам. Если он уже существует
# (первый запуск был через `docker run`), compose предупреждает при КАЖДОМ up:
# «volume ... was not created by Docker Compose». Это нормально: контейнер Running, данные целы.
name: preload-registry

services:
  registry:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: preload-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_BIND:-0.0.0.0}:${REGISTRY_PORT:-5050}:5000"
    environment:
      # локальная ФС, без auth: реестр живёт в LAN демо-стенда
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  registry-data:
    name: preload_registry
