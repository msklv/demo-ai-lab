# M4 — маршрут https://mcp.demo-ai-lab.ru (спека mcp-registry-spec.md §1).
# Свой Certificate в ns mcp-registry: Ingress не умеет cross-namespace TLS-секреты
# (правило E-серии — серт живёт в ns Ingress'а).
# Один path «/» на порт 8080: витрина, /v0*, /docs и /metrics отдаются с одного порта.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-demo-tls
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: mcp-demo-tls
  dnsNames:
    - mcp.demo-ai-lab.ru
  issuerRef:
    name: letsencrypt-wildcard
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - mcp.demo-ai-lab.ru
      secretName: mcp-demo-tls
  rules:
    - host: mcp.demo-ai-lab.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 8080
