# K2 — PostgreSQL 17.11 для Keycloak (спека keycloak-spec.md §4.2).
# Размещение: soft-affinity на пару k8s-02/03 (ADR-0003: «ingress + лёгкие сервисы»);
# k8s-04 намеренно не в списке — на демо он занят GPUStack/инференсом.
# SPOF принят (R-K2): r=2 Longhorn спасает данные, не доступность.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # обычный ClusterIP, не headless: headless-DNS появляется только с готовым подом, и на первом
  # синке Keycloak успевал стартовать раньше БД (UnknownHostException → exit 1 → рестарт).
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      priorityClassName: demo-stand-critical
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-02, k8s-03]
      containers:
        - name: postgres
          image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: db-name}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: db-username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: db-password}
            # подкаталог: в корне тома Longhorn лежит lost+found, initdb на непустом каталоге падает
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - name: pg
              containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 8Gi
