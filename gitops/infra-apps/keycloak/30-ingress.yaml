# K4 — маршрут https://auth.demo-ai-lab.ru (спека architecture/specs/keycloak-spec.md §4.4).
# Свой Certificate в ns keycloak: Ingress не умеет cross-namespace TLS-секреты,
# wildcard-секрет из demo-test переиспользовать нельзя (R-K6).
# Публичность — только пользовательские пути: OIDC realm `dev` и статика страниц входа.
# Catch-all `/` и админ-поверхность (`/admin*`, `/realms/master*`, `/health`, `/metrics`) не
# маршрутизируются вовсе → снаружи `404` от шлюза (ревизия 2026-11-25, §4.5). Публикация нового
# пути — осознанная правка этого файла; admin-консоль — port-forward на `svc/keycloak:8080`.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-demo-tls
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: auth-demo-tls
  dnsNames:
    - auth.demo-ai-lab.ru
  issuerRef:
    name: letsencrypt-wildcard
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - auth.demo-ai-lab.ru
      secretName: auth-demo-tls
  rules:
    - host: auth.demo-ai-lab.ru
      http:
        paths:
          # Пользовательский трафик: OIDC realm `dev` (auth, token, logout, certs, .well-known,
          # login-actions, account) и темы/ассеты страницы входа. Всё остальное — без маршрута.
          - path: /realms/dev
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
