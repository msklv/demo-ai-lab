# Allowlist служебных UI Higress — «только локальные сети» (решение владельца 2026-11-04,
# `architecture/specs/external-access-spec.md` E9 / E9.1 / E9.2; ревизия ADR-0004).
#
# Хосты под правилом: `argo.` (Argo CD), `hgc.` (консоль Higress), `lng.` (Longhorn UI),
# `mon.` (Kuvasz, ADR-0009). Пользовательские хосты (`owu`, `spk`, `doc`, `mcp`, …) под правило
# НЕ попадают.
#
# Выпуск/продление сертификата `mon-demo-tls` идёт по http-01 через публичный путь, поэтому на
# время выпуска `mon.` исключается из списков (иначе LE получает 403 на ACME-путь) и на внешней VM
# снимается SNI-денилст haproxy. Порядок окна и отката — `gitops/infra-apps/monitoring/30-ingress.yaml`.
#
# Плагин — официальный Higress `ip-restriction` (исходники тега `v2.1.9`, `VERSION 1.0.0`),
# отдаётся из своего тома `wasm-store` (см. `wasm-store.yaml`): OCI-путь реестра Higress
# анонимно не тянется (401 на `higress/plugins/*`). Поля конфига сверены с README плагина
# в этом теге: `ip_source_type` (`origin-source` | `header`), `ip_header_name`, `allow`,
# `deny`, `status`, `message`.
#
# --- Почему в allow-списке ТОЛЬКО 192.168.10.0/24 (ревизия 2026-11-25) -------------------
#
# До 25.11 в обоих объектах стояли `10.0.0.0/8` и `172.16.0.0/12`. Это делало гейт фиктивным:
#   * внешний путь (интернет → haproxy на VM → SSH-hop → нода) приходит в Higress с private-адресом
#     hop'а — замер 25.11: `downstream_remote_address=10.0.0.59`, `x_forwarded_for=10.0.0.59`;
#     `10.0.0.0/8` в allow-списке пропускал его → `/admin/...` и служебные UI отдавались интернету;
#   * LAN приходит с настоящим клиентским адресом (замер 25.11: `peer=192.168.10.11`, из пода —
#     `10.0.2.x`), то есть различать «LAN vs интернет» плагин МОЖЕТ — мешал именно `10/8`.
# Проверка гейта: из LAN `200`, из пода кластера (peer `10.0.2.x`) — `403`.
# Внешний путь дополнительно рвётся SNI-денилстом haproxy (TLS `000`) — это второй, независимый слой.
#
# --- Две грабли Higress, проверенные на живом стенде 2026-11-04 -------------------------
#
# 1) `defaultConfig` — это ГЛОБАЛЬНЫЙ конфиг плагина: контроллер кладёт его в `pluginConfig`
#    целиком (`pkg/ingress/config/ingress_config.go` → `convertIstioWasmPlugin`), и он
#    применяется ко ВСЕМ хостам шлюза, а не только к `matchRules`. С allowlist'ом в
#    `defaultConfig` получили `403` на `owu.`/`spk.`/`doc.`/`mcp.`. Поэтому здесь
#    `defaultConfigDisable: true`, а правило живёт в `matchRules[].config` — там оно
#    ограничено списком доменов.
# 2) `matchRules[].config` обязателен. Правило без `config` разбирается плагином как пустое
#    («allow and deny cannot be empty»), `failStrategy: FAIL_CLOSE` превращает это в
#    `Plugin configured to fail closed failed to load` и `500` на всех хостах правила.
#    Добавляя новый домен — копировать блок `config` целиком.
#
# --- Почему ДВА объекта -----------------------------------------------------------------
#
# 1) `lan-only-ui` — allow по `X-Forwarded-For` (плагин берёт ПЕРВЫЙ адрес списка, то есть
#    клиента). Нужен, если туннель снова поднимут стендовыми коннекторами (fallback-схема E7):
#    тогда peer на gateway = адрес узла в LAN, а XFF по-прежнему несёт клиента.
# 2) `lan-only-ui-lan-source` — allow по НАСТОЯЩЕМУ peer'у (`origin-source`). Это тот объект,
#    который ловит текущий внешний путь (peer = адрес SSH-hop'а).
# Оба объекта — allow-списки и складываются по «И»: LAN проходит оба, внешний путь отсекается
# вторым даже при подделанном XFF.
#
# `failStrategy: FAIL_CLOSE` — при сбое плагина запрос не обслуживается. Обратная сторона: если
# wasm не загрузится вовсе (нет файла в томе), правило исчезнет молча — поэтому `scripts/k8s_health.py`
# проверяет наличие обоих объектов, содержимое allow-списка и доступность wasm по `spec.url`,
# а `scripts/infra_wasm_plugins.sh --check` — сам файл в томе.
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: lan-only-ui
  namespace: higress-system
spec:
  phase: AUTHN
  priority: 400
  failStrategy: FAIL_CLOSE
  url: http://wasm-store.higress-system.svc.cluster.local:8080/wasm-plugins/ip-restriction/1.0.0/plugin.wasm
  defaultConfigDisable: true
  matchRules:
    - configDisable: false
      domain:
        - argo.demo-ai-lab.ru
        - hgc.demo-ai-lab.ru
        - lng.demo-ai-lab.ru
        - mon.demo-ai-lab.ru
      config:
        ip_source_type: header
        ip_header_name: x-forwarded-for
        allow:
          - 192.168.10.0/24
        status: 403
        message: "LAN only"
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: lan-only-ui-lan-source
  namespace: higress-system
spec:
  phase: AUTHN
  priority: 401
  failStrategy: FAIL_CLOSE
  url: http://wasm-store.higress-system.svc.cluster.local:8080/wasm-plugins/ip-restriction/1.0.0/plugin.wasm
  defaultConfigDisable: true
  matchRules:
    - configDisable: false
      domain:
        - argo.demo-ai-lab.ru
        - hgc.demo-ai-lab.ru
        - lng.demo-ai-lab.ru
        - mon.demo-ai-lab.ru
      config:
        ip_source_type: origin-source
        allow:
          - 192.168.10.0/24
        status: 403
        message: "LAN only"
