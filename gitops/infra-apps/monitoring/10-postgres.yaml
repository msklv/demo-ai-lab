# M1 — PostgreSQL 17 для Kuvasz (ADR-0009 §Решение).
# Размещение: k8s-05 (решение владельца 2026-11-09 — пятая нода дом для мониторинга).
# nodeAffinity preferred, не required: при потере 05 под уедет на другую ноду,
# а не залипнет в Pending.
# SPOF принят (ADR-0009 §Последствия): r=2 Longhorn спасает данные, не доступность.
# Нюанс: Longhorn на k8s-05 не планирует реплики (allowScheduling=false), но это
# не мешает PVC — реплики лягут на 02/03/04, под на 05 подключится к тому по сети.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: kuvasz-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # обычный ClusterIP, не headless: headless-DNS появляется только с готовым подом,
  # и на первом синке Kuvasz успевал стартовать раньше БД (грабли keycloak-spec §4.2).
  selector:
    app: kuvasz-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: kuvasz-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: kuvasz-postgres
  template:
    metadata:
      labels:
        app: kuvasz-postgres
    spec:
      priorityClassName: demo-stand-critical
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-05]
      containers:
        - name: postgres
          # тот же образ+digest, что у postgres из ns keycloak: уже лежит на нодах,
          # доп. pull не нужен (реестр доступен только из LAN — ADR-0009 §Валидация)
          image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: kuvasz-db, key: db-name}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: kuvasz-db, key: db-username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: kuvasz-db, key: db-password}
            # подкаталог: в корне тома Longhorn лежит lost+found, initdb на непустом каталоге падает
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - name: pg
              containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 8Gi
