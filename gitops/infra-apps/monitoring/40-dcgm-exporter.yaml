# M3 — DCGM exporter: телеметрия GPU ноды k8s-04 (спек: architecture/specs/monitoring-spec.md).
# Зачем: в стеке нет ни одного источника GPU-метрик — nvidia-smi только руками, GPUStack API /metrics
# отдаёт 404. DCGM читает счётчики карты через NVML/DCGM и публикует их в формате Prometheus.
# Размещение: DaemonSet с nodeSelector по NFD-метке PCI-присутствия NVIDIA — сейчас это одна нода
# (k8s-04, RTX 5070 Ti); при появлении второй GPU-ноды поднимется сама, править манифест не нужно.
# runtimeClassName nvidia — узлы подключают /dev/nvidia* через CDI (как gpustack-worker-nvidia);
# hostPath /dev не нужен. SYS_ADMIN не выдаём: он нужен только профилировщику (DCGM_FI_PROF_*),
# а нам нужны счётчики состояния (темп/ватты/VRAM/частоты) — без него.
# Метрики: nvidia/dcgm-exporter, пин по digest (тег-mutable). Экспортёр 4.9 читает конфиг
# (version 2, YAML) и набор счётчиков CSV: в образе ожидается /etc/dcgm-exporter/config.yaml
# (DCGM_EXPORTER_CONFIG_FILE), без него под падает на старте. CSV-набор ограничен 13 счётчиками:
# дефолтный список 4.x даёт ~60 серий на карту, из которых для борда нужны не все.
# Скрейп: higress-console-prometheus (ns higress-system) — конфиг статический, job добавляется
# скриптом scripts/prometheus_scrape_dcgm.sh (см. спеку, §"Почему job не в git").
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-config
  labels:
    app: dcgm-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.yaml: |
    version: 2
    metrics:
      - name: default
        file: /etc/dcgm-exporter/counters.csv
        every: 10s
        enrichment:
          kubernetes: auto
          container: false
          dra: false
          hpc_jobs: false
    outputs:
      prometheus:
        type: prometheus
        schema: dcgm/v1
        listen: ":9400"
    sources:
      dcgm:
        watch:
          max_keep_age: 10m
          max_keep_samples: 0
    server:
      max_concurrent_scrapes: 16
  counters.csv: |
    # DCGM field, Prometheus type, help
    DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (C)
    DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (C)
    DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (W)
    DCGM_FI_DEV_POWER_MGMT_LIMIT, gauge, Power limit (W)
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, gauge, Total energy consumption (mJ)
    DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (%)
    DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory bandwidth utilization (%)
    DCGM_FI_DEV_FB_USED, gauge, Framebuffer used (MiB)
    DCGM_FI_DEV_FB_FREE, gauge, Framebuffer free (MiB)
    DCGM_FI_DEV_SM_CLOCK, gauge, SM clock (MHz)
    DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock (MHz)
    DCGM_FI_DEV_FAN_SPEED, gauge, Fan speed (%)
    DCGM_FI_DEV_XID_ERRORS, gauge, Value of the last XID error encountered
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  labels:
    app: dcgm-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  labels:
    app: dcgm-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: dcgm-exporter
      annotations:
        # под-аннотации — для будущего платформенного Prometheus с pod-SD (сейчас не используются)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      runtimeClassName: nvidia
      priorityClassName: demo-stand-critical
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      containers:
        - name: exporter
          image: nvidia/dcgm-exporter:4.7.0-4.9.0-distroless@sha256:2490e1dfb5baaee6765ef2841813af7d978bb459a566c22c326a8fc27c64eea9
          # конфиг и набор счётчиков — из ConfigMap ниже, путь совпадает с DCGM_EXPORTER_CONFIG_FILE
          # privileged обязателен: с runtimeClassName nvidia CDI подставляет MIG-переменные
          # (NVIDIA_MIG_CONFIG_DEVICES/MONITOR_DEVICES), а containerd отказывается их ставить
          # в непривилегированный контейнер — под падает на OCI spec
          # («cannot set NVIDIA_MIG_* in a non-privileged container», проверено 2026-11-10).
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 9400
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/dcgm-exporter
              readOnly: true
          # старт DCGM на первой карте — единицы секунд; запас на холодный pull образа
          startupProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: dcgm-exporter-config
