# M3 — маршрут https://mon.demo-ai-lab.ru (ADR-0009 §Решение: адрес, доступ только из LAN).
# Свой Certificate в ns monitoring: Ingress не умеет cross-namespace TLS-секреты,
# wildcard-секрет из demo-test переиспользовать нельзя (грабли keycloak §K4).
# Закрытие извне: WasmPlugin lan-only-ui / lan-only-ui-lan-source уже содержат mon.
# в matchRules (gitops/infra-apps/infra/lan-only-ui.yaml) — домен был закрыт заранее,
# чтобы Ingress не появился без гейта.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mon-demo-tls
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: mon-demo-tls
  dnsNames:
    - mon.demo-ai-lab.ru
  # Выдача через публичный путь: LE идёт по редиректу haproxy `:80 → :443`, токен отдаёт
  # ingress-решатель cert-manager, TLS терминирует Higress. DNS-01 не годится: зона
  # demo-ai-lab.ru делегирована на ns1/ns2.reg.ru, а ClusterIssuer `letsencrypt-wildcard`
  # пишет TXT через Cloudflare API — LE этих записей не видит (грабли hermes-spec §13 п.7).
  #
  # Порядок окна выпуска (проверено 2026-11-09; повторить на продлении 2027-01-08):
  #   1) `mon.` исключить из ОБОИХ WasmPlugin `lan-only-ui*` — иначе LE получает `403`
  #      на `/.well-known/acme-challenge/`;
  #   2) на внешней VM снять `mon.demo-ai-lab.ru` из SNI-денилста haproxy `frontend public_https`
  #      (`/etc/haproxy/haproxy.cfg`, бэкап рядом) — иначе TLS-рукопожатие рвётся (`unexpected eof`);
  #   3) на время окна закрыть UI: `NetworkPolicy` в ns monitoring (podSelector `app=kuvasz`,
  #      `ingress: []`) — наружу остаётся живым только под-решатель ACME;
  #   4) удалить `certificate` → Argo пересоздаст; дождаться `Ready=True`;
  #   5) откатить 1–3 (SNI-денилст вернуть, NetworkPolicy удалить, `mon.` в гейт вернуть).
  # TLS для SNI `mon.` на время окна даёт wildcard-серт `*.demo-ai-lab.ru` (копия секрета
  # `demo-wildcard-tls` в `mon-demo-tls` до первой выдачи; после выдачи его перезаписывает cert-manager).
  issuerRef:
    name: letsencrypt-http01
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mon
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - mon.demo-ai-lab.ru
      secretName: mon-demo-tls
  rules:
    - host: mon.demo-ai-lab.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kuvasz
                port:
                  number: 8080
