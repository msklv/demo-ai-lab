# values релиза `gpustack-csi-driver-s3` — чарт `csi-s3` 0.43.7 (апстрим yandex-cloud/k8s-csi-s3,
# каталог `deploy/helm/csi-s3`; helm-репозитория с index.yaml у апстрима нет).
# Релиз остаётся helm-ом: почему — README этого каталога, раздел «Вспомогательные релизы».
# Переустановка — из клона апстрима: helm upgrade --install gpustack-csi-driver-s3 ./deploy/helm/csi-s3 \
#   --version 0.43.7 -n gpustack -f <этот файл>. Сняты с живого релиза 2026-11-14.
controller:
  name: csi-s3-controller
  priorityClassName: system-cluster-critical
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/controlplane
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: CriticalAddonsOnly
    operator: Exists
driver:
  name: s3.csi.gpustack.ai
imagePullPolicy: IfNotPresent
imagePullSecrets:
- name: gpustack-image-pull-secret
images:
  csiProvisioner: docker.io/gpustack/mirrored-csi-provisioner:v6.1.0
  livenessProbe: docker.io/gpustack/mirrored-csi-livenessprobe:v2.17.0
  nodeDriverRegistrar: docker.io/gpustack/mirrored-csi-node-driver-registrar:v2.15.0
  s3: docker.io/gpustack/mirrored-csi-s3-driver:v0.43.7
node:
  livenessProbe:
    healthPort: 29663
  name: csi-s3-node
  priorityClassName: system-cluster-critical
  tolerations:
  - operator: Exists
nodeDriverRegistrar:
  livenessProbe:
    enabled: false
rbac:
  create: true
  name: csi-s3
secret:
  create: false
serviceAccount:
  controller: csi-s3-controller-sa
  create: true
  node: csi-s3-node-sa
storageClass:
  create: false
