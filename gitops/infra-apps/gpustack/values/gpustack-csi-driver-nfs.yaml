# values релиза `gpustack-csi-driver-nfs` — чарт `csi-driver-nfs` 4.13.2
# (repo https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts).
# Релиз остаётся helm-ом: почему — README этого каталога, раздел «Вспомогательные релизы».
# Сняты с живого релиза 2026-11-14 (`helm get values`):
#   helm upgrade --install gpustack-csi-driver-nfs csi-driver-nfs \
#     --repo https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts \
#     --version 4.13.2 -n gpustack -f gitops/infra-apps/gpustack/values/gpustack-csi-driver-nfs.yaml
controller:
  livenessProbe:
    healthPort: 29652
  name: csi-nfs-controller
  priorityClassName: system-cluster-critical
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/controlplane
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: CriticalAddonsOnly
    operator: Exists
driver:
  mountPermissions: 0
  name: nfs.csi.gpustack.ai
externalSnapshotter:
  enabled: false
feature:
  enableFSGroupPolicy: true
  enableInlineVolume: false
  propagateHostMountOptions: false
image:
  baseRepo: docker.io
  csiProvisioner:
    pullPolicy: IfNotPresent
    repository: /gpustack/mirrored-csi-provisioner
    tag: v6.1.0
  csiResizer:
    pullPolicy: IfNotPresent
    repository: /gpustack/mirrored-csi-resizer
    tag: v2.0.0
  csiSnapshotter:
    pullPolicy: IfNotPresent
    repository: /gpustack/mirrored-csi-snapshotter
    tag: v8.4.0
  livenessProbe:
    pullPolicy: IfNotPresent
    repository: /gpustack/mirrored-csi-livenessprobe
    tag: v2.17.0
  nfs:
    pullPolicy: IfNotPresent
    repository: /gpustack/mirrored-csi-nfs-driver
    tag: v4.13.0
  nodeDriverRegistrar:
    pullPolicy: IfNotPresent
    repository: /gpustack/mirrored-csi-node-driver-registrar
    tag: v2.15.0
imagePullSecrets:
- name: gpustack-image-pull-secret
node:
  livenessProbe:
    healthPort: 29653
  name: csi-nfs-node
  priorityClassName: system-cluster-critical
  tolerations:
  - operator: Exists
nodeDriverRegistrar:
  livenessProbe:
    enabled: false
rbac:
  create: true
  name: csi-nfs
serviceAccount:
  controller: csi-nfs-controller-sa
  create: true
  node: csi-nfs-node-sa
storageClass:
  create: false
volumeSnapshotClass:
  create: false
