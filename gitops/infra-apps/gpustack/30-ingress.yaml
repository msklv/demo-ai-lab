# G6 — публикация UI/API GPUStack (спека architecture/gpustack-spec.md §4.2, §4.4).
# Свой Ingress + Certificate: чартовый ингресс умеет только PEM в values (серт в git запрещён),
# и свой объект переживает `helm upgrade`. Бэкенд — ClusterIP-Service чарта, не headless.
# До G3 (helm install) сервиса ещё нет: Higress отдаёт 503 на api.* — это ожидаемое состояние.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gpustack-tls
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: gpustack-tls
  dnsNames:
    - api.demo-ai-lab.ru
  issuerRef:
    name: letsencrypt-wildcard
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpustack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - api.demo-ai-lab.ru
      secretName: gpustack-tls
  rules:
    - host: api.demo-ai-lab.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gpustack-server-cluster-ip
                port:
                  number: 30080
