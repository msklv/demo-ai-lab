# Helm values чарта open-webui 17.0.0 (appVersion 0.12.0) — спека architecture/specs/owu-spec.md §4.
# Каталог gitops/apps/owu уезжает в кластер как plain-манифесты (ApplicationSet `apps`
# раскладывает каталог без helm-источника), поэтому этот файл — источник для локального
# рендера, а не объект кластера. Команда рендера — gitops/apps/owu/README.md.
replicaCount: 1
image:
  repository: ghcr.io/open-webui/open-webui
  tag: "0.12.0"
  pullPolicy: IfNotPresent

# Сабчарты, которые тяннут лишние образы/GPU — выключены.
ollama:
  enabled: false
pipelines:
  enabled: false
tika:
  enabled: false
terminals:
  enabled: false

enableOpenaiApi: true
openaiBaseApiUrl: "https://api.demo-ai-lab.ru/v1"
openaiApiKeyExistingSecret: owu-secrets
openaiApiKeyExistingSecretKey: OPENAI_API_KEY

# Одна реплика: in-memory websocket-менеджер, без Redis-контейнера.
websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: longhorn

sso:
  enabled: true
  enableSignup: true
  oidc:
    enabled: true
    providerName: Keycloak
    providerUrl: "https://auth.demo-ai-lab.ru/realms/dev/.well-known/openid-configuration"
    clientExistingSecret: owu-oidc
    clientIdExistingSecretKey: OAUTH_CLIENT_ID
    clientExistingSecretKey: OAUTH_CLIENT_SECRET
    scopes: "openid email profile"

# ingress чарта выключен (дефолт false): TLS-секрет и маршрут — свои, 30-ingress.yaml.
extraEnvVars:
  - name: WEBUI_URL
    value: "https://owu.demo-ai-lab.ru"
  - name: ENABLE_OAUTH
    value: "True"
  - name: OPENID_REDIRECT_URI
    value: "https://owu.demo-ai-lab.ru/oauth/oidc/callback"
  # иначе часть env после первого старта читается из БД, а не из манифеста
  - name: ENABLE_OAUTH_PERSISTENT_CONFIG
    value: "False"
  - name: ENABLE_SIGNUP
    value: "False"
  - name: DEFAULT_USER_ROLE
    value: "user"
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: owu-secrets
        key: WEBUI_SECRET_KEY
  # SQLite на сетевом томе Longhorn (R-O1)
  - name: DATABASE_POOL_SIZE
    value: "1"
  - name: DATABASE_SQLITE_PRAGMA_BUSY_TIMEOUT
    value: "30000"
  - name: ENABLE_DB_MIGRATIONS
    value: "true"
  # Движок извлечения документов = Docling стенда (architecture/specs/owu-spec.md §7.3).
  # Источник — env: строки config в webui.db для этих ключей НЕ создаются (seed_defaults
  # берёт значения отсюда); правка только через values + перерендер + sync.
  - name: CONTENT_EXTRACTION_ENGINE
    value: "docling"
  # FQDN обязателен: дефолт чарта http://docling:5001 — имя сервиса в ns doc, из ns owu не резолвится.
  - name: DOCLING_SERVER_URL
    value: "http://docling.doc.svc.cluster.local:5001"
  # Без ocr_preset docling-serve идёт auto и теряет кириллицу (грабля doc-spec v1.2);
  # OWU подмешивает DOCLING_PARAMS в form-data запроса /v1/convert/file.
  - name: DOCLING_PARAMS
    value: '{"ocr_preset": "ru-en"}'
  # В Open WebUI 0.12 модель из внешнего подключения (GPUStack) без записи в БД (workspace-модели)
  # видна ТОЛЬКО админу (utils/models.py: `elif user.role == 'admin'`), поэтому обычный SSO-пользователь
  # видел пустой список моделей. Для стенда контроль доступа моделей выключен; список моделей режется
  # на самом подключении (`model_ids`) — whisper в owu не попадает.
  - name: BYPASS_MODEL_ACCESS_CONTROL
    value: "true"
  # RAG-эмбеддинги и реранк — модели 780M в GPUStack (owu-spec §7.4, gpustack-spec §4.6).
  # ВАЖНО: при ENABLE_PERSISTENT_CONFIG=true (дефолт 0.12) строка config в webui.db ПЕРЕКРЫВАЕТ env.
  # После смены модели удалить строки rag.embedding_engine / rag.embedding_model / rag.openai.*
  # (и rag.reranking_* при смене реранкера), иначе OWU продолжит считать all-MiniLM-L6-v2 (384 dim).
  - name: RAG_EMBEDDING_ENGINE
    value: "openai"
  - name: RAG_EMBEDDING_MODEL
    value: "bge-m3"
  - name: RAG_OPENAI_API_BASE_URL
    value: "https://api.demo-ai-lab.ru/v1"
  # Наследует OPENAI_API_KEY (owu-all, доступ ко всем моделям) — отдельный ключ не нужен, пишем явно.
  - name: RAG_OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: owu-secrets
        key: OPENAI_API_KEY
  # Батч 8: замер bge-m3 на 780M — 8 текстов в батче дают ~2.3k tok/s, единичные запросы вдвое хуже.
  - name: RAG_EMBEDDING_BATCH_SIZE
    value: "8"
  - name: RAG_EMBEDDING_MODEL_AUTO_UPDATE
    value: "False"
  # Реранк работает ТОЛЬКО в гибридном поиске; engine=external шлёт {model, query, documents, top_n}
  # с Authorization: Bearer на vLLM /v1/rerank (0.12: retrieval/models/external.py).
  - name: ENABLE_RAG_HYBRID_SEARCH
    value: "true"
  - name: RAG_RERANKING_ENGINE
    value: "external"
  - name: RAG_RERANKING_MODEL
    value: "bge-reranker-v2-m3"
  - name: RAG_EXTERNAL_RERANKER_URL
    value: "https://api.demo-ai-lab.ru/v1/rerank"
  - name: RAG_EXTERNAL_RERANKER_API_KEY
    valueFrom:
      secretKeyRef:
        name: owu-secrets
        key: OPENAI_API_KEY
  - name: RAG_RERANKING_BATCH_SIZE
    value: "8"

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 5

# preferred, а не hard-pin: k8s-04 занят GPUStack, 02/03 несут ingress-VIP.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: demo-ai-lab/role
              operator: In
              values: [ingress]
