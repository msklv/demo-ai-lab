# Отрендеренный чарт open-webui 17.0.0 (appVersion 0.12.0) — спека architecture/owu-spec.md §4.
# ПОЧЕМУ рендер в файл: ApplicationSet `apps` раскладывает каталог как plain-манифесты —
# helm-источника у него нет (gitops/root/applicationsets.yaml). Values — gitops/values/owu.yaml.
# Правка только через рендер: helm template owu open-webui/open-webui --version 17.0.0 \
#   --namespace owu -f gitops/values/owu.yaml  → этот файл (команда в README.md).
---
# Source: open-webui/templates/service-account.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: owu-open-webui-sa
  namespace: owu
  labels:
    helm.sh/chart: open-webui-17.0.0
    app.kubernetes.io/version: "0.12.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: owu
    app.kubernetes.io/component: open-webui
automountServiceAccountToken: false
---
# Source: open-webui/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: owu-open-webui
  namespace: owu
  labels:
    helm.sh/chart: open-webui-17.0.0
    app.kubernetes.io/version: "0.12.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: owu
    app.kubernetes.io/component: open-webui
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
# Source: open-webui/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: owu-open-webui
  namespace: owu
  labels:
    helm.sh/chart: open-webui-17.0.0
    app.kubernetes.io/version: "0.12.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: owu
    app.kubernetes.io/component: open-webui
spec:
  selector:
    app.kubernetes.io/instance: owu
    app.kubernetes.io/component: open-webui
  type: ClusterIP
  ports:
  - protocol: TCP
    name: http
    port: 80
    targetPort: http
---
# Source: open-webui/templates/workload-manager.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: owu-open-webui
  namespace: owu
  labels:
    helm.sh/chart: open-webui-17.0.0
    app.kubernetes.io/version: "0.12.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: owu
    app.kubernetes.io/component: open-webui
    
spec:
  replicas: 1
  serviceName: owu-open-webui
  selector:
    matchLabels:
      app.kubernetes.io/instance: owu
      app.kubernetes.io/component: open-webui
  template:
    metadata:
      labels:
        helm.sh/chart: open-webui-17.0.0
        app.kubernetes.io/version: "0.12.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/instance: owu
        app.kubernetes.io/component: open-webui
    spec:
      initContainers:
      - name: copy-app-data
        image: ghcr.io/open-webui/open-webui:0.12.0
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - cp -R -n /app/backend/data/* /tmp/app-data/
        volumeMounts:
        - name: data
          mountPath: /tmp/app-data
      enableServiceLinks: false
      automountServiceAccountToken: false
      serviceAccountName: owu-open-webui-sa
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:0.12.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        env:
        - name: "ENABLE_OLLAMA_API"
          value: "False"
        # If only an OpenAI API value is set, set it to OPENAI_API_BASE_URL
        - name: "OPENAI_API_BASE_URL"
          value: "https://api.demo-ai-lab.ru/v1"
        - name: "OPENAI_API_KEY"
          valueFrom:
            secretKeyRef:
              name: owu-secrets
              key: OPENAI_API_KEY
        - name: "ENABLE_WEBSOCKET_SUPPORT"
          value: "True"
        - name: "ENABLE_OAUTH_SIGNUP"
          value: "True"
        - name: "OAUTH_CLIENT_ID"
          valueFrom:
            secretKeyRef:
              name: "owu-oidc"
              key: "OAUTH_CLIENT_ID"
        - name: "OAUTH_CLIENT_SECRET"
          valueFrom:
            secretKeyRef:
              name: "owu-oidc"
              key: "OAUTH_CLIENT_SECRET"
        - name: "OPENID_PROVIDER_URL"
          value: "https://auth.demo-ai-lab.ru/realms/dev/.well-known/openid-configuration"
        - name: "OAUTH_PROVIDER_NAME"
          value: "Keycloak"
        - name: "OAUTH_SCOPES"
          value: "openid email profile"
        - name: WEBUI_URL
          value: https://owu.demo-ai-lab.ru
        - name: ENABLE_OAUTH
          value: "True"
        - name: OPENID_REDIRECT_URI
          value: https://owu.demo-ai-lab.ru/oauth/oidc/callback
        - name: ENABLE_OAUTH_PERSISTENT_CONFIG
          value: "False"
        - name: ENABLE_SIGNUP
          value: "False"
        - name: DEFAULT_USER_ROLE
          value: user
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: WEBUI_SECRET_KEY
              name: owu-secrets
        - name: DATABASE_POOL_SIZE
          value: "1"
        - name: DATABASE_SQLITE_PRAGMA_BUSY_TIMEOUT
          value: "30000"
        - name: ENABLE_DB_MIGRATIONS
          value: "true"
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "true"
        tty: true
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: demo-ai-lab/role
                operator: In
                values:
                - ingress
            weight: 100
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: owu-open-webui
