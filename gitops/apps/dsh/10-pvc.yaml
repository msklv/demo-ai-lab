# W2 — состояние агента: DSH_HOME (/opt/data) — профили, сессии, скиллы, плагины профиля.
# Одна реплика + RWO: второй писатель в тот же профиль не поддерживается (спека §1).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-data
  namespace: dsh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
