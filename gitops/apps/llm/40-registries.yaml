# Описание регистров, без которых маршрут `llm.` не работает (НЕ применять как объект).
#
# Факт стенда: контроллер Higress разбирает только McpBridge `higress-system/default` — свой McpBridge
# в другом namespace (или второй объект в higress-system) остаётся инертным: «Registry Watcher is ready»
# для его регистров не появляется, а wasm-вызовы падают `error status returned by host: bad argument`
# (кластера `outbound|<port>||<name>.<type>` нет). Поэтому регистры добавляются в `default`, а он
# принадлежит GPUStack (`gpustack.ai/managed`) — список поддерживает `scripts/llm_proxy_plugins.sh`
# (идемпотентный merge) после каждого деплоя модели. Это тот же принятый компромисс «дрейф конфига»,
# что и у самого ai-proxy (спека §5.1), а не забытая деталь.
#
# Зачем каждый:
#   deepseek — аплинк ai-proxy (`higress.io/destination: deepseek.dns` у Ingress);
#   opa      — OPA-плагин (policy llm_auth), кластер `outbound|8181||opa.dns`;
#   valkey   — счётчики ai-token-ratelimit, `outbound|6379||valkey.dns`;
#   guard    — модель-страж через **стабильный API GPUStack** (`api.`), `outbound|443||guard.dns`.
#              До 2026-11-02 ходили в Service `qwen3guard` (45-guard-endpoint.yaml), но его селектор
#              и порт привязаны к имени инстанса и уезжали при каждом пересоздании модели
#              (`...-pvdgr`:40000 → `...-rzr90`:40039 → `...-4h679`:40042) — каждый раз fail-closed
#              503 на всех чатах. Через API инстанс не важен: `api.` → GPUStack сам находит
#              запущенную модель. Ключ `guard` должен иметь доступ к `Qwen3Guard-Gen-4B`,
#              имя модели в API — с заглавными (на инстансе served-name в нижнем регистре).
registries:
  - name: deepseek
    type: dns
    domain: api.deepseek.com
    port: 443
    # protocol: https — Envoy идёт к провайдеру по TLS с SNI = domain. Без этого SNI уходит
    # host'ом маршрута (llm.demo-ai-lab.ru), и edge провайдера рвёт handshake
    # (проверено: curl с SNI llm.demo-ai-lab.ru на IP DeepSeek → ssl/tls alert handshake failure).
    protocol: https
  - name: opa
    type: dns
    domain: opa.llm.svc.cluster.local
    port: 8181
  - name: valkey
    type: dns
    domain: valkey.llm.svc.cluster.local
    port: 6379
  - name: guard
    type: dns
    domain: api.demo-ai-lab.ru
    port: 443
    protocol: https
