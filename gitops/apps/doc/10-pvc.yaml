# D1 — кэш моделей docling (спека architecture/specs/doc-spec.md §1, §4).
# Свой путь /modelcache, а НЕ baked-путь образа: пустой PVC поверх baked-каталога затирает
# встроенные модели и сервис не поднимается (риск R-D7). Наполняется hook'ом 20-prefetch-job.yaml.
#
# sync-wave -2: PVC монтирует Job-хук предзагрузки (волна -1) и Deployment (волна 0), поэтому
# создаётся первым. Если PVC окажется позже Job'а, под хука висит в Pending с
# `persistentvolumeclaim "docling-models" not found`, а синк стоит на своей волне.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docling-models
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
