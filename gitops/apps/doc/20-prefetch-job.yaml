# D1 — предзагрузка моделей в PVC (спека architecture/doc-spec.md §4, §6).
# Без этого Job'а REST-контейнер не стартует: в рантайме модели не докачиваются
# ("missing models → runtime error"), а baked-модели образа не содержат русского:
#   * rapidocr: нет моделей `eslav` (PP-OCRv5 East Slavic, ru-Cyrl мапится на него);
#   * tesserocr: в образе только eng-языки, нужен rus.traineddata.
#
# ПОЧЕМУ HOOK, а не обычный ресурс: Job иммутабелен после создания, а контроллер Job'а
# дописывает в `spec.template` метки `batch.kubernetes.io/controller-uid` — ArgoCD видит
# расхождение и пытается патчить шаблон: `Job.batch "docling-model-cache-load" is invalid:
# spec.template: ... field is immutable` → синк падает навсегда. Как hook объект не
# участвует в diff'е. Скрипт идемпотентен (маркер `.prefetch-complete`): на повторных синках
# выходит за пару секунд, качает только недостающее.
apiVersion: batch/v1
kind: Job
metadata:
  name: docling-model-cache-load
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"   # PVC — волна -2, Deployment — 0
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docling-model-cache
        app.kubernetes.io/part-of: demo-ai-lab
    spec:
      restartPolicy: Never
      # PVC — RWO: пока сервис работает, том занят подом docling. Кросс-нодовый attach даёт
      # Multi-Attach error и синк виснет, поэтому хук ставится на ту же ноду, что и под сервиса
      # (на одной ноде том монтируется обоим подам). preferred, а не required: при первой
      # установке сервиса ещё нет, и хук должен стартовать на любой ноде.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: docling
                topologyKey: kubernetes.io/hostname
      # образ UBI-based: uid 1001, группа 0; fsGroup делает PVC записываемым для него
      securityContext:
        fsGroup: 1001
      containers:
        - name: loader
          image: quay.io/docling-project/docling-serve-cpu:v1.38.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              MARKER=/modelcache/.prefetch-complete
              if [ -f "$MARKER" ] && [ -f /modelcache/tessdata/rus.traineddata ]; then
                echo "models already prefetched:"; du -sh /modelcache; exit 0
              fi

              echo "== docling models =="
              # eslav — рабочий русский RapidOCR-пресет; ch — дефолт auto-OCR: warm-up моделей
              # на старте (load_models_at_boot) инициализирует его ДО применения пресетов,
              # и без ch-чекпоинтов docling-serve падает в CrashLoopBackOff
              # ("RapidOCR artifacts not found ... PP-OCRv6_det_small.onnx").
              docling-tools models download --output-dir /modelcache \
                layout tableformer picture_classifier rapidocr easyocr \
                --rapidocr-backend-lang onnxruntime:eslav \
                --rapidocr-backend-lang onnxruntime:ch
              echo "== tesseract tessdata =="
              TD=""
              for d in "${TESSDATA_PREFIX:-}" /usr/share/tesseract/tessdata \
                       /usr/share/tessdata /usr/share/tesseract-ocr/5/tessdata; do
                if [ -n "$d" ] && [ -f "$d/eng.traineddata" ]; then TD="$d"; break; fi
              done
              if [ -z "$TD" ]; then echo "tessdata dir not found" >&2; exit 1; fi
              echo "tessdata source: $TD"
              mkdir -p /modelcache/tessdata
              cp -a "$TD"/. /modelcache/tessdata/
              if [ ! -f /modelcache/tessdata/rus.traineddata ]; then
                python3 - <<'PY'
              import urllib.request
              url = "https://github.com/tesseract-ocr/tessdata_best/raw/main/rus.traineddata"
              dst = "/modelcache/tessdata/rus.traineddata"
              print("download", url)
              urllib.request.urlretrieve(url, dst)
              PY
              fi
              ls -1 /modelcache/tessdata | head -20
              touch "$MARKER"
              du -sh /modelcache
          volumeMounts:
            - name: modelcache
              mountPath: /modelcache
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: modelcache
          persistentVolumeClaim:
            claimName: docling-models
