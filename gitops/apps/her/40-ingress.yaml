# H5 — публикация https://hm.demo-ai-lab.ru (спека §4.3, §13 п.12).
#
# TLS — свой Certificate от ClusterIssuer `letsencrypt-http01` (HTTP-01 через Higress):
#   LE → <публичный IP>:80 (haproxy на внешней VM: frontend `public_http`, 301 на https)
#      → :443 (mode tcp) → SSH-hop'ы 02/03 → Higress → под-солвер cert-manager.
# Выпущено 2026-11-06: CN=hm.demo-ai-lab.ru, LE YR2, до 2027-02-04, автопродление за 30 дней.
# Прежний вариант — копия wildcard `demo-wildcard-tls` (до 17.01.2027) — больше не нужен,
# но и не мешает: пересечение обеспечивает серт самого хоста.
#
# ВНИМАНИЕ: любой валидный Ingress зоны сразу публикуется наружу. Панель всегда за провайдером входа
# (сейчас basic + OIDC Keycloak); LAN-гейт `lan-only-ui` — отдельная правка infra-каталога.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hm
  namespace: her
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: hm-demo-tls
  dnsNames:
    - hm.demo-ai-lab.ru
  issuerRef:
    name: letsencrypt-http01
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: her
  namespace: her
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - hm.demo-ai-lab.ru
      secretName: hm-demo-tls
  rules:
    - host: hm.demo-ai-lab.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes
                port:
                  number: 9119
