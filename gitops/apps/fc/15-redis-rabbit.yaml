# C3 — redis (rate-limit/кэш, emptyDir) + rabbitmq (очередь crawl, PVC 2Gi).
# Спека: architecture/specs/firecrawl-spec.md §1. Оба — ClusterIP, наружу не смотрят.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app: firecrawl-redis}
spec:
  type: ClusterIP
  selector: {app: firecrawl-redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app: firecrawl-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: firecrawl-redis}
  template:
    metadata:
      labels: {app: firecrawl-redis}
    spec:
      priorityClassName: demo-stand-critical
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-05]
      containers:
        - name: redis
          image: redis:8.10.1-alpine@sha256:de4d18872bf67ad0bd62224a712263975ca1d53b9b1d0d5d076082e7fa887890
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {app: firecrawl-rabbitmq}
spec:
  type: ClusterIP
  selector: {app: firecrawl-rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  labels: {app: firecrawl-rabbitmq}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: {app: firecrawl-rabbitmq}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: firecrawl-rabbitmq}
  template:
    metadata:
      labels: {app: firecrawl-rabbitmq}
    spec:
      priorityClassName: demo-stand-critical
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-05]
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13.7-management@sha256:9cfb7e92ae7d296aec4d1ae799e431209f7ed57d55f9c929d95667d0ccf1c920
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: fc-secrets, key: rabbitmq-user}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: fc-secrets, key: rabbitmq-password}
            # PVC на Longhorn: без фиксированного node name кластер rabbitmq собирается из hostname пода
            - {name: RABBITMQ_NODENAME, value: "rabbit@localhost"}
            - {name: RABBITMQ_USE_LONGNAME, value: "false"}
          ports:
            - {name: amqp, containerPort: 5672}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
          # без securityContext: entrypoint rabbitmq делает chown /var/lib/rabbitmq под root
          startupProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
