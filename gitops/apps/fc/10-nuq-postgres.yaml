# C3 — state-БД Firecrawl (форк postgres от апстрима, pg_cron внутри).
# Спека: architecture/specs/firecrawl-spec.md §1, §4.
# Обязательно: command с -c cron.database_name=<POSTGRES_DB>, иначе initdb падает на pg_cron.
# Размещение: preferred на k8s-05 (осознанно вместо пары 02/03 из спеки — ресурсы под Chromium).
apiVersion: v1
kind: Service
metadata:
  name: nuq-postgres
  labels: {app: nuq-postgres}
spec:
  type: ClusterIP
  selector: {app: nuq-postgres}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nuq-postgres
  labels: {app: nuq-postgres}
spec:
  serviceName: nuq-postgres
  replicas: 1
  selector:
    matchLabels: {app: nuq-postgres}
  template:
    metadata:
      labels: {app: nuq-postgres}
    spec:
      priorityClassName: demo-stand-critical
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-05]
      containers:
        - name: nuq-postgres
          image: ghcr.io/firecrawl/nuq-postgres@sha256:5a0be88215431b8dd57ae5d701ee191521cd1ac8e882a65558ae95c4587c57cb
          # грабля апстрим-образа: без этой опции initdb падает (ждёт совпадения имени БД).
          # Передаём через args, а НЕ command: command затирает docker-entrypoint.sh, и postgres
          # отказывается стартовать root'ом ("root execution ... is not permitted").
          args: ["-c", "cron.database_name=firecrawl"]
          env:
            - {name: POSTGRES_USER, value: "firecrawl"}
            - {name: POSTGRES_DB, value: "firecrawl"}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: fc-secrets, key: postgres-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: pg, containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          # без securityContext: entrypoint образа стартует root'ом и сам переходит на uid postgres
          startupProbe:
            tcpSocket: {port: pg}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: pg}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: pg}
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
