# S3 — Speakr: Flask+gunicorn на 8899; ASR — GPUStack, тексты — внешняя модель через `llm-svc.`
# (спека architecture/specs/spk-spec.md §4, v1.6).
# Секреты (ns spk) создаются до первого синка:
#   spk-secrets: SECRET_KEY, TRANSCRIPTION_API_KEY, TEXT_MODEL_API_KEY (статический ключ llm-svc),
#                ADMIN_USERNAME/EMAIL/PASSWORD
#   spk-oidc:    SSO_CLIENT_ID=spk, SSO_CLIENT_SECRET (сид Keycloak)
# ASR-коннектор — openai_whisper (OpenAI-совместимый /v1/audio/transcriptions),
# НЕ asr_endpoint (тот постит multipart на /asr).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakr
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # RWO-том + SQLite single-writer: старый под должен умереть до старта нового.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: speakr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speakr
        app.kubernetes.io/part-of: demo-ai-lab
    spec:
      containers:
        - name: speakr
          image: docker.io/learnedmachine/speakr:0.10.18-alpha-lite
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8899
          env:
            - name: ALLOW_REGISTRATION
              value: "false"          # в коде дефолт true — это открытая саморегистрация
            - name: TRANSCRIPTION_CONNECTOR
              value: openai_whisper
            - name: TRANSCRIPTION_BASE_URL
              value: "https://api.demo-ai-lab.ru/v1"
            - name: TRANSCRIPTION_MODEL
              value: whisper-turbo
            - name: TEXT_MODEL_BASE_URL
              value: "https://llm-svc.demo-ai-lab.ru/v1"   # внешняя модель за Higress: DLP + страж fail-closed (ADR-0008)
            - name: TEXT_MODEL_NAME
              value: deepseek-flash
            - name: ENABLE_SSO
              value: "true"
            - name: SSO_PROVIDER_NAME
              value: Keycloak
            - name: SSO_DISCOVERY_URL
              value: "https://auth.demo-ai-lab.ru/realms/dev/.well-known/openid-configuration"
            - name: SSO_REDIRECT_URI
              value: "https://spk.demo-ai-lab.ru/auth/sso/callback"
            - name: SSO_AUTO_REGISTER
              value: "true"
            # false: локальный вход по паролю (bootstrap-админ `admin`) остаётся запасным входом
            # на демо — решение владельца 28.10.2026. При true форма /login отключена и единственный
            # путь в приложение — Keycloak (так было до правки, вопреки строке в спеке).
            - name: SSO_DISABLE_PASSWORD_LOGIN
              value: "false"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            # Перед приложением ОДИН прокси — Higress (envoy), он сам дописывает X-Forwarded-For.
            # При 2 ProxyFix срезает лишний хоп и remote_addr остаётся адресом пода Higress
            # (наблюдалось 10.0.0.88): rate-limit `10 per minute` на /auth/sso/login считался на
            # ВСЕХ клиентов сразу, и вход отбивался 429 после десятка попыток.
            # GPUStack/vox-box не принимает контейнер `audio/aac`: отвечает
            # `{"status_code":400,"detail":"Unsupported file format: audio/aac"}` — причём с HTTP 200,
            # поэтому Speakr видит «200 без текста» и валит запись в FAILED. Кодеки из этого списка
            # конвертируются в AUDIO_CODEC (по умолчанию mp3) ДО отправки — mp3/vaw/m4a шлюз принимает.
            - name: AUDIO_UNSUPPORTED_CODECS
              value: "aac"
            # Бюджеты вывода. Историческое ограничение было из-за локальной vLLM с ctx 4096: max_tokens
            # больше ctx → 400 «cannot be greater than max_model_len», и запись падала уже после
            # успешной транскрибации. С 2026-11-02 текст генерирует внешняя `deepseek-flash`
            # (ctx 1M, выход до 384K), но у неё **reasoning списывается из max_tokens**: при 2500 на
            # 35-секундном транскрипте весь бюджет ушёл в reasoning и саммари пришло пустым.
            # Бюджеты подняты с запасом под reasoning (решение владельца 02.11: внешняя модель позволяет).
            - name: TITLE_MAX_TOKENS
              value: "4000"
            - name: SUMMARY_MAX_TOKENS
              value: "32000"
            - name: EVENT_MAX_TOKENS
              value: "8000"
            - name: TRUSTED_PROXY_HOPS
              value: "1"
          envFrom:
            - secretRef:
                name: spk-secrets
            - secretRef:
                name: spk-oidc
          volumeMounts:
            - name: data
              mountPath: /data
          # /health у приложения нет, GET / → 302: TCP-проба безопаснее httpGet.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: speakr-data
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: demo-ai-lab/role
                    operator: In
                    values: [ingress]
