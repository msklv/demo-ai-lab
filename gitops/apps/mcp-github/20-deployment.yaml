# GitHub MCP (self-host) — спецификация: architecture/specs/hermes-spec.md §7.1, ADR-0012.
# Только внутрь кластера: ни Ingress, ни сертификата, ни SSO. Токена в поде нет —
# PAT приходит заголовком Authorization от агента (per-request).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  namespace: mcp-github
  labels:
    app.kubernetes.io/name: github-mcp
    app.kubernetes.io/part-of: demo-ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-mcp
        app.kubernetes.io/part-of: demo-ai-lab
    spec:
      priorityClassName: demo-stand-critical
      containers:
        - name: github-mcp
          image: ghcr.io/github/github-mcp-server:v1.12.0@sha256:7cc0b474f2bff1e7e5bc794999e19b42d476ee6dba0cf1a305f4ced2de158348
          # `args`, а НЕ `command`: ENTRYPOINT образа — /server/github-mcp-server,
          # `command` заменил бы его и под упал бы `exec: "http": executable file not found`.
          args:
            - http
            - --listen-host
            - 0.0.0.0
            - --port
            - "8101"
            - --read-only
            - --toolsets
            - repos,issues,pull_requests,users
          ports:
            - containerPort: 8101
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      affinity:
        # лёгкий stateless — на пару ingress, k8s-04/05 не занимаем
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: demo-ai-lab/role
                    operator: In
                    values: [ingress]
